name: 🤖 Nox Agent Nightly Tasks

on:
  schedule:
    # Run nightly at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:  # Allow manual triggers

jobs:
  nox-agent-tasks:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          # Install basic dependencies for agent functionality
          pip install pyyaml requests pandas

      - name: 🔍 Validate IAM Agent Files
        run: |
          echo "✅ Checking IAM Agent files..."
          if [ -f "IAM_Agent.py" ]; then
            echo "✅ IAM_Agent.py found"
            python -m py_compile IAM_Agent.py
          else
            echo "❌ IAM_Agent.py not found"
            exit 1
          fi
          
          if [ -f "IAM_AutonomousAgent.py" ]; then
            echo "✅ IAM_AutonomousAgent.py found"
            python -m py_compile IAM_AutonomousAgent.py
          fi

      - name: 🧪 Test Agent Components
        run: |
          echo "🧪 Testing agent components..."
          python -c "
          import sys
          sys.path.append('.')
          
          # Test basic imports
          try:
              import yaml
              print('✅ YAML support available')
          except ImportError:
              print('❌ YAML support missing')
          
          try:
              import requests
              print('✅ HTTP requests support available')
          except ImportError:
              print('❌ HTTP requests support missing')
          
          try:
              import pandas as pd
              print('✅ Pandas support available')
          except ImportError:
              print('❌ Pandas support missing')
          
          # Check if agent files are syntactically correct
          try:
              import ast
              with open('IAM_Agent.py', 'r') as f:
                  ast.parse(f.read())
              print('✅ IAM_Agent.py syntax valid')
          except Exception as e:
              print(f'❌ IAM_Agent.py syntax error: {e}')
          "

      - name: 📊 Check System Status
        run: |
          echo "📊 IAM System Status Report - $(date)"
          echo "======================================="
          
          # Check core files
          echo "📁 Core Files:"
          ls -la *.py | grep -E "(IAM_|backend\.py)" || echo "No IAM core files found"
          
          # Check IAM_GUI directory
          echo -e "\n📁 IAM_GUI Status:"
          if [ -d "IAM_GUI" ]; then
            ls -la IAM_GUI/backend.py && echo "✅ Backend available"
            ls -la IAM_GUI/templates/ | head -5
          else
            echo "❌ IAM_GUI directory not found"
          fi
          
          # Check IAM_Knowledge directory
          echo -e "\n📁 IAM_Knowledge Status:"
          if [ -d "IAM_Knowledge" ]; then
            find IAM_Knowledge -name "*.json" | wc -l | xargs echo "📄 JSON files:"
            find IAM_Knowledge -name "*.csv" | wc -l | xargs echo "📊 CSV files:"
          else
            echo "❌ IAM_Knowledge directory not found"
          fi

      - name: 🔧 Validate Configuration
        run: |
          echo "🔧 Configuration Validation"
          echo "=========================="
          
          # Check for requirements.txt
          if [ -f "requirements.txt" ]; then
            echo "✅ requirements.txt found"
            echo "📦 Dependencies:"
            head -10 requirements.txt
          else
            echo "⚠️ requirements.txt not found"
          fi
          
          # Check for setup files
          echo -e "\n🔧 Setup Files:"
          ls -la setup*.sh 2>/dev/null || echo "No setup scripts found"
          ls -la *.yaml 2>/dev/null || echo "No YAML config files found"

      - name: 📝 Generate Status Report
        run: |
          cat > nox-agent-status.md << EOF
          # 🤖 Nox Agent Nightly Status Report
          
          **Date:** $(date -u)
          **Repository:** IAM - Intelligent Agent for Molecules
          
          ## ✅ System Health Check
          
          - Core agent files validated
          - Python syntax checks passed
          - Dependencies verified
          - Configuration validated
          
          ## 📊 Repository Statistics
          
          - Python files: $(find . -name "*.py" | wc -l)
          - Agent files: $(find . -name "*Agent*.py" | wc -l)
          - Knowledge files: $(find . -name "*.json" -o -name "*.csv" | wc -l)
          
          ## 🎯 Next Scheduled Run
          
          Tomorrow at 2:00 AM UTC
          
          ---
          *Generated by Nox Agent Nightly Workflow*
          EOF
          
          echo "📝 Status report generated:"
          cat nox-agent-status.md

      - name: 🏁 Workflow Complete
        run: |
          echo "🎉 Nox Agent Nightly workflow completed successfully!"
          echo "📊 All system checks passed"
          echo "⏰ Next run: Tomorrow at 2:00 AM UTC"